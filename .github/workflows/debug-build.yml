name: Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: 构建 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 配置构建环境
        uses: ./.github/actions/setup-build

      - name: 构建 Debug APK
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          "-Peta.buildMetadata=${GITHUB_SHA::7}"
          :app:assembleDebug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-debug-apk
          path: app/build/outputs/apk/debug/Eta-v*.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
